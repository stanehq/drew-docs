<!-- Drew brand: dark by default (matches drewbot.xyz), Unbounded and Albert Sans type, square corners. -->
<script>
  try {
    if (!localStorage.getItem("retype_scheme")) {
      document.documentElement.classList.remove("light");
      document.documentElement.classList.add("dark");
    }
  } catch (e) {}
</script>
