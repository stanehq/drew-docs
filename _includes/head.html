<!-- Drew brand: dark by default (matches drewbot.xyz), Geist type, softer surfaces. -->
<script>
  try {
    if (!localStorage.getItem("retype_scheme")) {
      document.documentElement.classList.remove("light");
      document.documentElement.classList.add("dark");
    }
  } catch (e) {}
</script>
