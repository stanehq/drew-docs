<!-- Drew brand: keep Retype navigation, focus, and callouts on-brand in both color schemes. -->
<script>
  try {
    if (!localStorage.getItem("retype_scheme")) {
      document.documentElement.classList.remove("light");
      document.documentElement.classList.add("dark");
    }
  } catch (e) {}
</script>
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
<meta name="theme-color" content="#050807" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Unbounded:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link href="/static/brand-overrides.css" rel="stylesheet" />
<style>
  body, .font-sans { font-family: "Albert Sans", ui-sans-serif, system-ui, sans-serif; }
  code, kbd, pre, samp, .font-mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace; }
  h1, h2, h3 { font-family: "Unbounded", "Albert Sans", ui-sans-serif, system-ui, sans-serif; letter-spacing: -0.01em; }
  h1 { letter-spacing: -0.02em; }
  *, *::before, *::after { border-radius: 0 !important; }
  #retype-back-to-top { background: #0a0f0d !important; border-color: rgba(65,207,139,.45) !important; }
  #retype-back-to-top:hover { background: rgba(65,207,139,.12) !important; border-color: #41cf8b !important; }
  #retype-back-to-top svg { color: #41cf8b !important; fill: #41cf8b !important; }
  img[src$="neevets.png"] { background: transparent !important; }
  html.dark img[src$="neevets.png"] { filter: invert(1); }
</style>
